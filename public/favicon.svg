<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0a192f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Border glow -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
  <!-- AK text centered -->
  <text x="32" y="32" font-family="Arial, sans-serif" font-weight="800" font-size="30" text-anchor="middle" dominant-baseline="central">
    <tspan fill="url(#accent)">A</tspan><tspan fill="#e2e8f0">K</tspan>
  </text>
</svg>
